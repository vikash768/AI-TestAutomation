# =============================================================================
# AI-TestAutomation — services
#   postgres    findings, components, tests, runs (Grafana reads it directly)
#   api         web UI + JSON API + /metrics (FastAPI)
#   worker      runs the seven-stage pipeline with Playwright Chromium
#   prometheus  scrapes api:8000/metrics for run-level trends
#   grafana     the report: dashboards over Postgres + Prometheus
# =============================================================================
services:
  postgres:
    image: postgres:17
    container_name: qa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa}
      POSTGRES_DB: ${POSTGRES_DB:-qa}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa} -d ${POSTGRES_DB:-qa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: qa-api
    command: uvicorn qaplatform.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qa}:${POSTGRES_PASSWORD:-qa}@postgres:5432/${POSTGRES_DB:-qa}
      ARTIFACTS_DIR: /app/artifacts
      GRAFANA_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    container_name: qa-worker
    command: python -m qaplatform.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qa}:${POSTGRES_PASSWORD:-qa}@postgres:5432/${POSTGRES_DB:-qa}
      ARTIFACTS_DIR: /app/artifacts
      HEADLESS: "true"
    shm_size: 1g
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: qa-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - qa_promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=90d'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.2.2
    container_name: qa-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      QA_PG_USER: ${POSTGRES_USER:-qa}
      QA_PG_PASSWORD: ${POSTGRES_PASSWORD:-qa}
      QA_PG_DB: ${POSTGRES_DB:-qa}
      QA_API_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - qa_grafana:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  qa_pgdata:
  qa_promdata:
  qa_grafana:
